    <script type="text/javascript">

        Survey

        var json = {
  "title": "Panic Disorder Severity Scale (PDSS)",
  "showQuestionNumbers": "off",
  "pages": [
    {
      "name": "page1",
      "elements": [
        {
          "type": "html",
          "name": "pdss_directions",
          "html": "<div>Several of the following questions refer to panic attacks and limited symptom attacks. For this questionnaire, we define a PANIC ATTACK as: a sudden rush of fear or discomfort accompanied by 4 OR MORE of the symptoms listed below. Rapid or pounding heartbeat Sweating Trembling or shaking Breathlessness Chest pain or discomfort Nausea Dizziness or faintness Feelings of unreality Chills or hot flushes Fear of losing control or going crazy Fear of dying Numbness or tingling Feeling of choking If during the panic attack, the four symptoms peak within 10 minutes, it is considered a sudden rush. A &quot;limited symptom attack&quot; is similar to a panic attack, but has LESS THAN 4 symptoms.</div>"
        },
        {
          "type": "radiogroup",
          "name": "pdss_1",
          "title": "1. How many panic attacks (4 or more symptoms) and limited symptom attacks (fewer than 4 symptoms) did you have during the past week?",
          "choices": [
            {
              "value": 0,
              "text": "No panic or limited symptom episodes"
            },
            {
              "value": 1,
              "text": "Mild: no full panic attacks, and no more than 1 limited symptom attack a day"
            },
            {
              "value": 2,
              "text": "Moderate: 1 or 2 full panic attacks and/or multiple limited symptom attacks/day"
            },
            {
              "value": 3,
              "text": "Severe: more than 2 full attacks but not more than 1/day on average"
            },
            {
              "value": 4,
              "text": "Extreme: full panic attacks occurred more than once a day, more days than not"
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_2",
          "title": "2. If you had any panic attacks during the past week, how distressing (uncomfortable, frightening) were they while they were happening? (If you had more than one, give an average rating. If you didn't have any panic attacks but did have limited symptom attacks, answer for the limited symptom attacks.)",
          "choices": [
            {
              "value": 0,
              "text": "Not at all distressing, or no panic or limited symptom attacks during the past week"
            },
            {
              "value": 1,
              "text": "Mildly distressing (not too intense)"
            },
            {
              "value": 2,
              "text": "Moderately distressing (intense, but still manageable)"
            },
            {
              "value": 3,
              "text": "Severely distressing (very intense)"
            },
            {
              "value": 4,
              "text": "Extremely distressing (extreme distress during all attacks)"
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_3",
          "title": "3. During the past week, how much have you worried or felt anxious about when your next panic attack would occur or about fears related to the attacks (for example, that they could mean you have physical or mental health problems or could cause you social embarrassment)?",
          "choices": [
            {
              "value": 0,
              "text": "Not at all"
            },
            {
              "value": 1,
              "text": "Occasionally or only mildly"
            },
            {
              "value": 2,
              "text": "Frequently or moderately"
            },
            {
              "value": 3,
              "text": "Very often or to a very disturbing degree"
            },
            {
              "value": 4,
              "text": "Nearly constantly and to a disabling extent"
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_4a",
          "title": "4a. During the past week, were there any places or situations (e.g., public transportation, movie theaters, crowds, bridges, tunnels, shopping malls, being alone) you avoided, or felt afraid of (uncomfortable in, wanted to avoid or leave), because of fear of having a panic attack? Are there any other situations that you would have avoided or been afraid of if they had come up during the week, for the same reason?",
          "choices": [
            {
              "value": 1,
              "text": "Yes"
            },
            {
              "value": 0,
              "text": "No"
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_4b",
          "title": "4b. If yes to either question, please rate your level of fear and avoidance this past week.",
          "choices": [
            {
              "value": 1,
              "text": "Mild: occasional fear and/or avoidance but I could usually confront or endure the situation. There was little or no modification of my lifestyle due to this."
            },
            {
              "value": 2,
              "text": "Moderate: noticeable fear and/or avoidance but still manageable. I avoided some situations, but I could confront them with a companion. There was some modification of my lifestyle because of this, but my overall functioning was not impaired."
            },
            {
              "value": 3,
              "text": "Severe: extensive avoidance. Substantial modification of my lifestyle was required to accommodate the avoidance making it difficult to manage usual activities."
            },
            {
              "value": 4,
              "text": "Extreme: pervasive disabling fear and/or avoidance. Extensive modification in my lifestyle was required such that important tasks were not performed."
            }
          ],
          "isRequired": true,
          "visibleIf": "{pdss_4a} = 1"
        },
        {
          "type": "radiogroup",
          "name": "pdss_5a",
          "title": "5a. During the past week, were there any activities (e.g., physical exertion, sexual relations, taking a hot shower or bath, drinking coffee, watching an exciting or scary movie) that you avoided, or felt afraid of (uncomfortable doing, wanted to avoid or stop), because they caused physical sensations similar to those you feel during panic attacks or that you were afraid might trigger a panic attack? Are there any other activities that you would have avoided or been afraid of if they had come up during the week for that reason?",
          "choices": [
            {
              "value": 1,
              "text": "Yes"
            },
            {
              "value": 0,
              "text": "No"
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_5b",
          "title": "5b. If yes to either question, please rate your level of fear and avoidance of those activities this past week.",
          "choices": [
            {
              "value": 1,
              "text": "Mild: occasional fear and/or avoidance, but usually I could confront or endure with little distress activities that cause physical sensations. There was little modification of my lifestyle due to this."
            },
            {
              "value": 2,
              "text": "Moderate: noticeable avoidance but still manageable. There was definite, but limited, modification of my lifestyle such that my overall functioning was not impaired"
            },
            {
              "value": 3,
              "text": "Severe: extensive avoidance. There was substantial modification of my lifestyle or interference in my functioning."
            },
            {
              "value": 4,
              "text": "Extreme: pervasive and disabling avoidance. There was extensive modification in my lifestyle due to this such that important tasks or activities were not performed."
            }
          ],
          "isRequired": true,
          "visibleIf": "{pdss_5a} = 1"
        },
        {
          "type": "radiogroup",
          "name": "pdss_6",
          "title": "6. During the past week, how much did the above symptoms altogether (panic and limited symptom attacks, worry about attacks, and fear of situations and activities because of attacks) interfere with your ability to work or carry out your responsibilities at home? (If your work or home responsibilities were less than usual this past week, answer how you think you would have done if the responsibilities had been usual.)",
          "choices": [
            {
              "value": 0,
              "text": "No interference with work or home responsibilities"
            },
            {
              "value": 1,
              "text": "Slight interference with work or home responsibilities, but I could do nearly everything I could if I didn't have these problems."
            },
            {
              "value": 2,
              "text": "Significant interference with work or home responsibilities, but I still could manage to do the things I needed to do."
            },
            {
              "value": 3,
              "text": "Substantial impairment in work or home responsibilities; there were many important things I couldn't do because of these problems."
            },
            {
              "value": 4,
              "text": "Extreme, incapacitating impairment such that I was essentially unable to manage any work or home responsibilities."
            }
          ],
          "isRequired": true
        },
        {
          "type": "radiogroup",
          "name": "pdss_7",
          "title": "7. During the past week, how much did panic and limited symptom attacks, worry about attacks and fear of situations and activities because of attacks interfere with your social life? (If you didn't have many opportunities to socialize this past week, answer how you think you would have done if you did have opportunities.)",
          "choices": [
            {
              "value": 0,
              "text": "No interference"
            },
            {
              "value": 1,
              "text": "Slight interference with social activities, but I could do nearly everything I could if I didn't have these problems."
            },
            {
              "value": 2,
              "text": "Significant interference with social activities but I could manage to do most things if I made the effort."
            },
            {
              "value": 3,
              "text": "Substantial impairment in social activities; there are many social things I couldn't do because of these problems"
            },
            {
              "value": 4,
              "text": "Extreme, incapacitating impairment, such that there was hardly anything social I could do."
            }
          ],
          "isRequired": true
        },
        {
          "type": "html",
          "name": "pdss_citation",
          "html": "<div>Shear MK, Brown TA, Barlow DH, et al. Multicenter collaborative panic disorder severity scale. American Journal of Psychiatry 1997, 154 (11): 1571-5</div>"
        }
      ]
    }
  ]
};

        // REDCap fields in REDCap order: [name, kind, checkbox codes]. kind = value | checkbox | date | calc
        var COLUMNS = [["pdss_1", "value", null], ["pdss_2", "value", null], ["pdss_3", "value", null], ["pdss_4a", "value", null], ["pdss_4b", "value", null], ["pdss_5a", "value", null], ["pdss_5b", "value", null], ["pdss_6", "value", null], ["pdss_7", "value", null], ["pdss_total_score", "calc", null]];

        window.survey = new Survey.Model(json);

        // Labels may hold line breaks (multi-line REDCap labels); show them, escaping everything else
        survey.onTextMarkdown.add(function (sender, options) {
            if (options.text.indexOf('\n') < 0) return;
            var div = document.createElement('div');
            div.textContent = options.text;
            options.html = div.innerHTML.replace(/\n/g, '<br>');
        });

        // ---- REDCap calculation semantics ----
        // A blank field is NaN, so plain arithmetic on a blank is blank (as in REDCap); sum() skips blanks;
        // division by zero is blank.
        var D = {};
        function v(name) {
            var x = D[name];
            if (x === undefined || x === null || x === '') return NaN;
            var n = Number(x);
            return isNaN(n) ? x : n;
        }
        function S() {
            var n = Array.prototype.filter.call(arguments, function (x) { return typeof x === 'number' && !isNaN(x); });
            return n.length ? n.reduce(function (a, b) { return a + b; }, 0) : NaN;
        }
        function IF(c, a, b) { return c ? a : b; }
        function C() {
            return Array.prototype.map.call(arguments, function (x) { return (typeof x === 'number' && isNaN(x)) ? '' : String(x); }).join('');
        }
        function fin(x) { return (typeof x === 'number' && !isFinite(x)) ? '' : x; }

        // Saved rows become CSV files that staff open in Excel. A text value starting with = + - @, a tab or a
        // carriage return would be read there as a formula, so it is stored with a leading apostrophe (shown
        // as plain text). Numbers, including negative ones typed into a text box, are left as they are.
        var NUMBER = /^[-+]?(\d+(\.\d*)?|\.\d+)([eE][-+]?\d+)?$/;
        function csvSafe(x) {
            if (typeof x !== 'string' || !/^[=+\-@\t\r]/.test(x) || NUMBER.test(x)) return x;
            return "'" + x;
        }

        function today() {
            var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }

        /** Survey answers -> one flat row with every REDCap field, then the REDCap scores. */
        function assembleData(raw) {
            D = {};
            var answers = {};
            Object.keys(raw).forEach(function (key) {
                if (key.indexOf('__matrix_') === 0) Object.assign(answers, raw[key]);   // matrix grid rows
                else answers[key] = raw[key];
            });
            COLUMNS.forEach(function (col) {
                var name = col[0], kind = col[1];
                if (kind === 'checkbox') {
                    var picked = answers[name] || [];
                    col[2].forEach(function (code) {
                        var value = /^-?(0|[1-9][0-9]*)$/.test(code) ? Number(code) : code;
                        D[name + '___' + code] = picked.indexOf(value) >= 0 ? 1 : 0;
                    });
                } else if (kind === 'date') {
                    D[name] = today();
                } else if (kind === 'value') {
                    D[name] = (answers[name] === undefined || answers[name] === null) ? '' : answers[name];
                } else {
                    D[name] = '';
                }
            });
            // ---- REDCap calc / @CALCTEXT fields (same formulas, same names) ----
            D['pdss_total_score'] = fin(( v('pdss_1') + v('pdss_2') + v('pdss_3') + IF(v('pdss_4a')==0, 0, v('pdss_4b')) + IF(v('pdss_5a')==0, 0, v('pdss_5b')) + v('pdss_6') + v('pdss_7') )/7)

            // page timing, as in the other StimtoolOnline surveys
            Object.keys(raw).forEach(function (key) {
                if (key.indexOf('TRQ') === 0) D[key] = raw[key];
            });
            // after the scores, so they are computed from the answers as given
            Object.keys(D).forEach(function (key) { D[key] = csvSafe(D[key]); });
            return D;
        }

        // Record the response time or how long they spent on a page
        lastpage = survey.currentPage;
        function timerLoop(elapsed) {
            var page = survey.currentPage;
            if (!page) return;
            if (lastpage != page) {
                start = new Date().getTime();
                lastpage = page
            }
            var valueName = "TRQ" + survey.pages.indexOf(page);
            var ms = survey.getValue(valueName);
            if (ms == null) ms = 0;
            else ms = elapsed;
            survey.setValue(valueName, ms);
        }

        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                if (decodeURIComponent(pair[0]) == variable) {
                    return decodeURIComponent(pair[1]);
                }
            }
            return 'NULL'
        }

        survey.showProgressBar = "bottom";
        survey.goNextPageAutomatic = false
        survey.showNavigationButtons = true;
        survey.showCompletedPage = false;

        var surveyname = getQueryVariable('survey');

        // CANON data is saved in the CANON data folder, like the CANON tasks (the link's study is a condition study)
        var expInfo = { 'participant': '' ,'session': '',  'task': surveyname, 'date' : formatDate(), 'study': 'CANON', 'id': getQueryVariable('id') };

        const getInfoPromise = new Promise((resolve, reject) => {
            $.ajax({
                type: "POST",
                url: '/getInfo',
                data: { 'id': expInfo.id },
                dataType: 'JSON',
                success: function (data) {
                    resolve(data)
                }
            })
        })
            .then((values) => {
                if (values.subject && values.session && values.study) {
                    expInfo.participant = values.subject
                    expInfo.link_study = values.study
                    expInfo.session = values.session
                    expInfo.run_id = getQueryVariable('run')
                }

                survey.onComplete.add(function (result) {
                    postSurveyData(assembleData(result.data), expInfo.session, expInfo.participant);
                });

                $("#surveyElement").Survey({model: survey});

                $("#participant").text(expInfo.participant);
                $("#session").text(expInfo.session);
                $("#study").text(expInfo.link_study || expInfo.study);
            })

        function postSurveyData(data, session, participant) {
            $.ajax({
                type: "POST",
                url: '/save',
                data: {
                    "trials_data": data,
                    "expInfo": expInfo
                },
                dataType: 'JSON',
                statusCode: {
                    200: function() {
                        window.location.replace('/link?id=' + expInfo.id  + '&index=' + (parseInt(getQueryVariable('index')) + 1))
                    }
                }
            })
        }

        var start = new Date().getTime(),
            elapsed = '0.0';

        timerID = window.setInterval(function () {
            var time = new Date().getTime() - start;
            elapsed = Math.floor(time);
            timerLoop(elapsed);
        }, 5);
    </script>
