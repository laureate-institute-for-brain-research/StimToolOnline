        // REDCap fields in REDCap order: [name, kind, checkbox codes]. kind = value | checkbox | date | calc

        // ---- REDCap calculation semantics ----
        // A blank field is NaN, so plain arithmetic on a blank is blank (as in REDCap); sum() skips blanks;
        // division by zero is blank.
        var D = {};
        function v(name) {
            var x = D[name];
            if (x === undefined || x === null || x === '') return NaN;
            var n = Number(x);
            return isNaN(n) ? x : n;
        }
        function S() {
            var n = Array.prototype.filter.call(arguments, function (x) { return typeof x === 'number' && !isNaN(x); });
            return n.length ? n.reduce(function (a, b) { return a + b; }, 0) : NaN;
        }
        function IF(c, a, b) { return c ? a : b; }
        function C() {
            return Array.prototype.map.call(arguments, function (x) { return (typeof x === 'number' && isNaN(x)) ? '' : String(x); }).join('');

        function fin(x) { return (typeof x === 'number' && !isFinite(x)) ? '' : x; }

        // Saved rows become CSV files that staff open in Excel. A text value starting with = + - @, a tab or a
        // carriage return would be read there as a formula, so it is stored with a leading apostrophe (shown
        // as plain text). Numbers, including negative ones typed into a text box, are left as they are.
        var NUMBER = /^[-+]?(\d+(\.\d*)?|\.\d+)([eE][-+]?\d+)?$/;
        function csvSafe(x) {
            if (typeof x !== 'string' || !/^[=+\-@\t\r]/.test(x) || NUMBER.test(x)) return x;
            return "'" + x;
        }

        function today() {
            var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };

        /** Survey answers -> one flat row with every REDCap field, then the REDCap scores. */
        function assembleData(raw) {
            D = {};
            var answers = {};
            Object.keys(raw).forEach(function (key) {
                if (key.indexOf('__matrix_') === 0) Object.assign(answers, raw[key]);   // matrix grid rows

            });

                    var picked = answers[name] || [];

                        var value = /^-?(0|[1-9][0-9]*)$/.test(code) ? Number(code) : code;

                    });

                    D[name] = (answers[name] === undefined || answers[name] === null) ? '' : answers[name];

            D['retrofus_scoring_meals'] = fin(( IF(v('retro_fus_3')==0,0,6-v('retro_fus_3')) + IF(v('retro_fus_17')==0,0,6-v('retro_fus_17')) + IF(v('retro_fus_7')==0,0,v('retro_fus_7')) + IF(v('retro_fus_24')==0,0,v('retro_fus_24')) + IF(v('retro_fus_27')==0,0,v('retro_fus_27')) ) / ( IF(v('retro_fus_3')==0,0,1) + IF(v('retro_fus_17')==0,0,1) + IF(v('retro_fus_7')==0,0,1) + IF(v('retro_fus_24')==0,0,1) + IF(v('retro_fus_27')==0,0,1) ))

            D['retrofus_scoring_mom_nurture'] = fin(( IF(v('retro_fus_1')==0,0,6-v('retro_fus_1')) + IF(v('retro_fus_4')==0,0,6-v('retro_fus_4')) + IF(v('retro_fus_8')==0,0,6-v('retro_fus_8')) + IF(v('retro_fus_13')==0,0,6-v('retro_fus_13')) + IF(v('retro_fus_18')==0,0,6-v('retro_fus_18')) + IF(v('retro_fus_22')==0,0,6-v('retro_fus_22')) ) / ( IF(v('retro_fus_1')==0,0,1) + IF(v('retro_fus_4')==0,0,1) + IF(v('retro_fus_8')==0,0,1) + IF(v('retro_fus_13')==0,0,1) + IF(v('retro_fus_18')==0,0,1) + IF(v('retro_fus_22')==0,0,1) ))
            D['retrofus_scoring_dad_nurture'] = fin(( IF(v('retro_fus_2')==0,0,6-v('retro_fus_2')) + IF(v('retro_fus_5')==0,0,6-v('retro_fus_5')) + IF(v('retro_fus_9')==0,0,6-v('retro_fus_9')) + IF(v('retro_fus_14')==0,0,6-v('retro_fus_14')) + IF(v('retro_fus_19')==0,0,6-v('retro_fus_19')) + IF(v('retro_fus_23')==0,0,6-v('retro_fus_23')) ) / ( IF(v('retro_fus_2')==0,0,1) + IF(v('retro_fus_5')==0,0,1) + IF(v('retro_fus_9')==0,0,1) + IF(v('retro_fus_14')==0,0,1) + IF(v('retro_fus_19')==0,0,1) + IF(v('retro_fus_23')==0,0,1) ))
            D['retrofus_scoring_mom_discipline'] = fin(( IF(v('retro_fus_10')==0,0,v('retro_fus_10')) + IF(v('retro_fus_15')==0,0,v('retro_fus_15')) + IF(v('retro_fus_20')==0,0,v('retro_fus_20')) + IF(v('retro_fus_25')==0,0,v('retro_fus_25')) ) / ( IF(v('retro_fus_10')==0,0,1) + IF(v('retro_fus_15')==0,0,1) + IF(v('retro_fus_20')==0,0,1) + IF(v('retro_fus_25')==0,0,1) ))
            D['retrofus_scoring_dad_discipline'] = fin(( IF(v('retro_fus_11')==0,0,v('retro_fus_11')) + IF(v('retro_fus_16')==0,0,v('retro_fus_16')) + IF(v('retro_fus_21')==0,0,v('retro_fus_21')) + IF(v('retro_fus_26')==0,0,v('retro_fus_26')) ) / ( IF(v('retro_fus_11')==0,0,1) + IF(v('retro_fus_16')==0,0,1) + IF(v('retro_fus_21')==0,0,1) + IF(v('retro_fus_26')==0,0,1) ))

        function timerLoop(elapsed) {
            var page = survey.currentPage;
            if (!page) return;
            if (lastpage != page) {
                start = new Date().getTime();
                lastpage = page
            }
            var valueName = "TRQ" + survey.pages.indexOf(page);
            var ms = survey.getValue(valueName);
            if (ms == null) ms = 0;
            else ms = elapsed;
            survey.setValue(valueName, ms);

            var query = window.location.search.substring(1);
            var vars = query.split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                if (decodeURIComponent(pair[0]) == variable) {
                    return decodeURIComponent(pair[1]);
                }
            }
            return 'NULL'
        }

            })

            $.ajax({
                type: "POST",
                url: '/save',
                data: {
                    "trials_data": data,
                    "expInfo": expInfo
                },
                dataType: 'JSON',
                statusCode: {
                    200: function() {
                        window.location.replace('/link?id=' + expInfo.id  + '&index=' + (parseInt(getQueryVariable('index')) + 1))
                    }
                }
            })
        }

        var start = new Date().getTime(),
            elapsed = '0.0';

        timerID = window.setInterval(function () {

            elapsed = Math.floor(time);
            timerLoop(elapsed);
